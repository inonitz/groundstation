# MEASURED CALIBRATION OF THIS AIRFRAME -- 2026-08-11.
# calibrate_camera.py over 39 checkerboard frames (9x6 inner, 20 mm squares), 960x720,
# with full edge coverage and a 0.20-2.00 m distance spread.
# Reprojection RMS error: 0.438 px (target < 1.0 px) -- trustworthy.
# fps is the Tello's native stream rate (30), not the host-measured decode fps, which
# ran far below 30 under load and does not reflect the drone's output.
# FeatureExtractor block copied unchanged from config/stella_config_px4.yaml; tuning it is B1's job.

Camera:
  name: Tello_Real_Camera
  setup: monocular
  model: perspective
  fx: 914.980469812666
  fy: 914.705287791177
  cx: 486.0935386756224
  cy: 362.42163366938945
  k1: -0.025176094899854732
  k2: -0.004570986368618646
  p1: 0.00032905226647847376
  p2: 0.0017664448131143222
  k3: 0.10730186949886227
  fps: 30.0
  cols: 960
  rows: 720
  color_order: BGR

FeatureExtractor:
  name: "default"
  num_keypoints: 2500
  ini_fast_threshold: 10
  min_fast_threshold: 7
