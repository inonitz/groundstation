# ==============================================================================
# config/px4_sitl.yaml -- PX4 Gazebo SITL FMU tuning profile.
#
# These are the CURRENT compiled constexpr defaults, written out explicitly. This
# file documents the profile format and serves as the SITL reference: loading it
# is byte-for-byte identical to running with NO profile at all (the FMU's built-in
# constants ARE these SITL numbers). Copy it to start a new per-drone profile.
#
# The SITL harness (scripts/test/lib/sim_core.sh) does NOT set DRONE_CONFIG, so it
# runs on the compiled defaults directly. This file exists for documentation and
# for anyone who wants to tweak a single SITL value without a rebuild.
#
# Every value here MUST equal the matching `constexpr k*` in
# source/llm_to_action/fmu/fmu_node_base.hpp. If a constant changes, change it here
# too (or delete the line to fall back to the compiled value).
# ==============================================================================

# --- Takeoff (ENU, Up+) ---
takeoffTargetAltEnu:  2.0      # m   (kTakeoffTargetAltEnu)
takeoffClimbVelEnu:   2.0      # m/s (kTakeoffClimbVelEnu)

# --- Land (ENU, Down = -Up) ---
landDescendVelEnu:    -0.5     # m/s (kLandDescendVelEnu)
flareStartAltEnu:     1.0      # m   (kFlareStartAltEnu)
flareTouchdownVelEnu: -0.12    # m/s (kFlareTouchdownVelEnu)
groundContactEnu:     0.1      # m   (kGroundContactEnu)

# --- GO ---
defaultGoSpeedCmS:    30       # cm/s (kDefaultGoSpeedCmS)
goApproachGainHz:     0.5      # 1/s  (kGoApproachGainHz)
goCrossTrackGainHz:   1.0      # 1/s  (kGoCrossTrackGainHz)

# --- ROTATE ---
rotateYawGainHz:      1.5      # rad/s per rad (kRotateYawGainHz)
rotateMaxYawRate:     0.8      # rad/s (kRotateMaxYawRate)

# --- APPROACH ---
approachStandoffM:    2.50     # m    (kApproachStandoffM)
followStandoffM:      2.00     # m    (kFollowStandoffM) -- FOLLOW hold distance
approachSpeedDefault: 80       # cm/s (kApproachSpeedDefault)

# --- SEARCH (defaults == the MEDIUM size preset, kSearchSizePresets[1]) ---
searchSweepSpeedMps:  0.50     # m/s  (kSearchSweepSpeedMps)
searchLaneLengthM:    6.0      # m    (medium preset laneLengthM)
searchLaneSpacingM:   2.0      # m    (medium preset laneSpacingM)
searchLegTimeoutMs:   20000    # ms   (medium preset legTimeoutMs)

# --- ORBIT ---
orbitDefaultSpeedMps: 0.30     # m/s  (kOrbitDefaultSpeedMps)

# --- Emergency boundary ---
boundaryBaseM:        0.6      # m         (kBoundaryBaseM)
boundaryVelScale:     0.5      # m per m/s (kBoundaryVelScale)

# --- Battery failsafe ---
batteryReturnPct:     20       # % (kBatteryReturnPct)
batteryLandPct:       10       # % (kBatteryLandPct)

# --- Manual operator override ---
manualTeleopVelCmS:   50       # cm/s per axis (kManualTeleopVelCmS)
