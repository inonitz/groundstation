# SITL scenario table -- one row per scenario, read by run.sh.
# fields: name|scenario-flag|world|spawn-pose|objective|extra KEY=VALUE knobs|completion mode:timeout|verdict|tags
#   completion: how a HEADLESS run knows it is done -- flight = wait for real arm/land ground
#               truth, fixed = fixed seconds (scenario never takes off); blank = attended only.
#   verdict:    verified   = verdicts/<name>.sh gives a real PASS/FAIL
#               digest     = verdicts/<name>.sh only prints a milestone digest (always exit 0) --
#                            eyeball it attended; a headless "PASS" from these is meaningless
#               unverified = no verdict script at all
#   tags:       highvram = LAUNCH_VLM=1 loads Qwen3-VL on top of seg+depth ONNX (~12GiB VRAM
#               measured 2026-08-09) -- SKIP_HIGH_VRAM=1 skips these in --all.
# Dropped from the old tree: "colors" (depended on the archived slam comparator, broken),
# "dashboard" (an observability demo launcher, not a scenario -- see source/dashboard/),
# and run_all's six phantom rows (forward, speed, rotate-land, land-flare, terrain-land, battery).
approach|--scenario-approach|empty|0,7,3|Approach the canned target, then land.||flight:90|digest|
