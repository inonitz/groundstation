<!doctype html><html><head><meta charset="utf-8"><title>MVD</title><style>
*{margin:0;box-sizing:border-box}html,body{height:100%;background:#0b0d10;color:#e8eaed;font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden}
.wrap{display:grid;grid-template-columns:300px 1fr;height:100vh}
.rail{background:#14171c;border-right:1px solid #222;padding:16px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.brand{font-weight:700;font-size:16px;letter-spacing:.02em}.brand span{color:#4da3ff}
.kv{display:flex;justify-content:space-between;font-size:12px;color:#9aa0a6}.kv b{color:#e8eaed}
.notify{background:#231a12;border:1px solid #5a3d1f;border-radius:8px;padding:8px 10px;font-size:13px;color:#ffcf8f;display:none}
.chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;font-size:13px}
.msg{padding:6px 9px;border-radius:8px;max-width:100%}
.user{background:#1c2430;align-self:flex-end}.model{background:#1a1d22}.spoken{background:#12241f;color:#9fe6c8}
.role{font-size:10px;color:#6b7178;text-transform:uppercase;letter-spacing:.05em}
.stage{position:relative;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage img{width:100%;height:100%;object-fit:contain}
.sub{position:absolute;left:0;right:0;bottom:0;padding:18px 28px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:26px;font-weight:600;text-align:center;text-shadow:0 2px 8px #000;min-height:64px}
</style></head><body><div class="wrap">
<aside class="rail">
  <div class="brand">Voice<span>Drone</span> · MVD</div>
  <div class="kv"><span>fps</span><b id="fps">–</b></div>
  <div class="kv"><span>highlight</span><b id="tgt">–</b></div>
  <div class="notify" id="notify"></div>
  <div class="chat" id="chat"></div>
</aside>
<main class="stage"><img id="vid" src="/frame.jpg"><div class="sub" id="sub"></div></main>
</div><script>
const $=id=>document.getElementById(id);
setInterval(()=>{$("vid").src="/frame.jpg?t="+Date.now()},100);
async function poll(){try{const s=await(await fetch("/state?t="+Date.now())).json();
 $("fps").textContent=s.fps??"–";$("tgt").textContent=s.target||"none";$("sub").textContent=s.subtitle||"";
 const nz=(s.notify||[]).length;const n=$("notify");if(nz){n.style.display="block";n.textContent="🔔 "+nz+" match(es) in view"}else{n.style.display="none"}
 const c=$("chat");c.innerHTML="";(s.chat||[]).forEach(m=>{const d=document.createElement("div");d.className="msg "+m.role;
  d.innerHTML='<div class="role">'+({user:"you",model:"scene",spoken:"spoken"}[m.role]||m.role)+'</div>'+(m.text||"");c.appendChild(d)});
 c.scrollTop=c.scrollHeight;}catch(e){}setTimeout(poll,300)}poll();
</script></body></html>
