<h1>perf: one tracer per process, a ring per thread (rev5 module drawing, 2026-10-12)</h1>
<p class="sub">The document is perf.md; the header is perf.h. A thread records into its own ring. A writer thread drains every ring to a file. The report merges the files by the shared clock.</p>
<div class="scroll">
<svg viewBox="0 0 1400 820" xmlns="http://www.w3.org/2000/svg">
<text class="s" x="60" y="552">1  a thread takes PerfNow() before and after a step, then calls PerfRecord once</text>
<text class="s" x="60" y="570">2  the record goes into that thread's own ring: one producer, one consumer, no lock</text>
<text class="s" x="60" y="588">3  the writer thread drains every ring every 5 s and appends the file: one write, one fsync</text>
<text class="s" x="60" y="606">4  the report reads every file of the session and merges by the shared clock</text>
<rect class="proc" x="30" y="30" width="860" height="632"/>
<text class="t" x="44" y="56">THE APP PROCESS</text>
<text class="s" x="200" y="56">one tracer: PerfCreate(session, "app") first, PerfDestroy last</text>
<text class="s" x="60" y="78">1  threads that record</text>
<text class="s" x="350" y="78">2  one ring per thread</text>
<text class="s" x="560" y="78">3  one writer thread</text>
<rect class="box" x="60" y="90" width="230" height="44"/><text class="t" x="70" y="108">main thread</text><text class="s" x="70" y="125">frame, gpu, startup, e2e</text><path class="l-msg" d="M290,112 H350"/><rect class="pill" x="350" y="96" width="150" height="32"/><text class="mono" x="360" y="116">ring 0</text><path class="l-queue" d="M500,112 H560"/><rect class="box" x="60" y="144" width="230" height="44"/><text class="t" x="70" y="162">frame source</text><text class="s" x="70" y="179">frame read</text><path class="l-msg" d="M290,166 H350"/><rect class="pill" x="350" y="150" width="150" height="32"/><text class="mono" x="360" y="170">ring 1</text><path class="l-queue" d="M500,166 H560"/><rect class="box" x="60" y="198" width="230" height="44"/><text class="t" x="70" y="216">recognizer worker</text><text class="s" x="70" y="233">turn, llama request</text><path class="l-msg" d="M290,220 H350"/><rect class="pill" x="350" y="204" width="150" height="32"/><text class="mono" x="360" y="224">ring 2</text><path class="l-queue" d="M500,220 H560"/><rect class="box" x="60" y="252" width="230" height="44"/><text class="t" x="70" y="270">platform worker</text><text class="s" x="70" y="287">dji request</text><path class="l-msg" d="M290,274 H350"/><rect class="pill" x="350" y="258" width="150" height="32"/><text class="mono" x="360" y="278">ring 3</text><path class="l-queue" d="M500,274 H560"/><rect class="box" x="60" y="306" width="230" height="44"/><text class="t" x="70" y="324">emergency thread</text><text class="s" x="70" y="341">emergency</text><path class="l-msg" d="M290,328 H350"/><rect class="pill" x="350" y="312" width="150" height="32"/><text class="mono" x="360" y="332">ring 4</text><path class="l-queue" d="M500,328 H560"/><rect class="box" x="60" y="360" width="230" height="44"/><text class="t" x="70" y="378">voice workers x2</text><text class="s" x="70" y="395">say</text><path class="l-msg" d="M290,382 H350"/><rect class="pill" x="350" y="366" width="150" height="32"/><text class="mono" x="360" y="386">rings 5, 6</text><path class="l-queue" d="M500,382 H560"/><rect class="box" x="60" y="414" width="230" height="44"/><text class="t" x="70" y="432">job pool x8</text><text class="s" x="70" y="449">sam3 request, gate, count</text><path class="l-msg" d="M290,436 H350"/><rect class="pill" x="350" y="420" width="150" height="32"/><text class="mono" x="360" y="440">rings 7 to 14</text><path class="l-queue" d="M500,436 H560"/><rect class="box" x="60" y="468" width="230" height="44"/><text class="t" x="70" y="486">supervisor thread</text><text class="s" x="70" y="503">startup restart</text><path class="l-msg" d="M290,490 H350"/><rect class="pill" x="350" y="474" width="150" height="32"/><text class="mono" x="360" y="494">ring 15</text><path class="l-queue" d="M500,490 H560"/>
<rect class="mainbox" x="560" y="90" width="200" height="422"/>
<text class="t" x="572" y="114">writer thread</text>
<text x="572" y="140">every 5 s:</text>
<text x="572" y="158">drain each ring</text>
<text x="572" y="176">encode JSON lines</text>
<text x="572" y="194">one write, one fsync</text>
<text class="s" x="572" y="230">a full ring drops the</text>
<text class="s" x="572" y="248">new record and counts</text>
<text class="s" x="572" y="284">PerfFlush: the same,</text>
<text class="s" x="572" y="302">now, from the caller</text>
<text class="s" x="572" y="338">die(): PerfFlush after</text>
<text class="s" x="572" y="356">stop, manual, notify;</text>
<text class="s" x="572" y="374">1 s timeout on the lock</text>
<text class="s" x="572" y="410">Destroy: wake, join,</text>
<text class="s" x="572" y="428">drain once more, close</text>
